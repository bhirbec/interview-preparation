[project]
name = "interview-preparation-backend"
version = "0.1.0"
description = "Coding-trainer state API: attempts, runs and saved code over DynamoDB"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[tool.uv]
# server.py / db.py / build_content.py are flat modules, not an installable
# package — `uv sync` should provision the environment and stop there.
package = false
