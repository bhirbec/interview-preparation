services:
  frontend:
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./app:/app
      - frontend_node_modules:/app/node_modules
      - ./logs:/logs
    environment:
      CHOKIDAR_USEPOLLING: "1"
      # The browser stays same-origin; Vite proxies /api to the backend service.
      VITE_API_TARGET: http://api:8000
    depends_on:
      - api
    command: /bin/sh -c "mkdir -p /logs && npm run dev -- --host 0.0.0.0 2>&1 | tee /logs/frontend.log"

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./knowledge/coding-questions:/coding-questions:ro
      - ./knowledge/lessons:/lessons:ro
      # Writable: build_content.py generates the static content the app serves.
      # Mount app/public (tracked, already exists) rather than app/public/data —
      # Docker creates a missing bind-mount path root-owned.
      - ./app/public:/public-out
      - ./logs:/logs
    environment:
      QUESTIONS_DIR: /coding-questions
      LESSONS_DIR: /lessons
      CONTENT_OUT: /public-out/data
      # Setting DDB_ENDPOINT is also what tells the server it is running locally,
      # so it creates the table on boot; in AWS the table is CDK-managed.
      DDB_ENDPOINT: http://dynamodb:8000
      DDB_TABLE: trainer
      # DynamoDB Local ignores credentials, but boto3 refuses to sign without
      # them, so give it something.
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      - dynamodb
    # The generated content is gitignored, so build it on boot: a fresh clone
    # must not come up blank.
    command: /bin/sh -c "mkdir -p /logs && python build_content.py && uvicorn server:app --host 0.0.0.0 --port 8000 --reload 2>&1 | tee /logs/api.log"

  # User state lives here: one table, keyed by the id in the browser's cookie.
  dynamodb:
    restart: unless-stopped
    image: amazon/dynamodb-local:2.5.2
    # Published so host-side scripts (aws dynamodb --endpoint-url) can reach it;
    # the api container talks to it over the compose network instead.
    ports:
      - "${DDB_PORT:-8002}:8000"
    working_dir: /home/dynamodblocal
    # -sharedDb: one database file for every credential set, so it does not
    # matter which fake access key a client signs with.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "./data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    # The named volume mounts in root-owned; the image's own user cannot write
    # to it, and there is nothing to protect in a local dev database.
    user: root

volumes:
  frontend_node_modules:
  dynamodb_data:
