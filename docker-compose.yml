services:
  frontend:
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./app:/app
      - frontend_node_modules:/app/node_modules
      - ./logs:/logs
    environment:
      CHOKIDAR_USEPOLLING: "1"
    command: /bin/sh -c "mkdir -p /logs && npm run dev -- --host 0.0.0.0 2>&1 | tee /logs/frontend.log"

volumes:
  frontend_node_modules:
