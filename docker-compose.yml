services:
  frontend:
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./app:/app
      - frontend_node_modules:/app/node_modules
      - ./logs:/logs
    environment:
      CHOKIDAR_USEPOLLING: "1"
      # The browser stays same-origin; Vite proxies /api to the backend service.
      VITE_API_TARGET: http://api:8000
    depends_on:
      - api
    command: /bin/sh -c "mkdir -p /logs && npm run dev -- --host 0.0.0.0 2>&1 | tee /logs/frontend.log"

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./knowledge/coding-questions:/coding-questions:ro
      - ./knowledge/lessons:/lessons:ro
      # Writable: build_content.py generates the static content the app serves.
      # Mount app/public (tracked, already exists) rather than app/public/data —
      # Docker creates a missing bind-mount path root-owned.
      - ./app/public:/public-out
      - ./logs:/logs
    environment:
      # DynamoDB Local, in place of the AWS endpoint the deployed API talks to.
      # Setting this is also what makes the API create the tables on boot; in
      # AWS they belong to the CDK app in aws/.
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      # DynamoDB Local ignores the values but botocore refuses to sign without
      # them. They are not credentials and unlock nothing.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      QUESTIONS_DIR: /coding-questions
      LESSONS_DIR: /lessons
      CONTENT_OUT: /public-out/data
    depends_on:
      - dynamodb
    # The generated content is gitignored, so build it on boot: a fresh clone
    # must not come up blank.
    command: /bin/sh -c "mkdir -p /logs && python build_content.py && uvicorn server:app --host 0.0.0.0 --port 8000 --reload 2>&1 | tee /logs/api.log"

  # The same DynamoDB the deployed API uses, running locally. Not published on a
  # host port: only the api service talks to it, over the compose network.
  dynamodb:
    restart: unless-stopped
    image: amazon/dynamodb-local:2.5.2
    working_dir: /home/dynamodblocal
    # -sharedDb keeps one database file whatever credentials a client signs
    # with, so state survives a restart and stays reachable from any client.
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    # As root because a named volume mounted at a path the image does not ship
    # is created root-owned, and the image's own dynamodblocal user could not
    # write to it.
    user: root
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

volumes:
  frontend_node_modules:
  dynamodb_data:
